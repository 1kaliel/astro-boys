name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: No secrets, .env, credentials or data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_repo_hygiene.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Lint, tests, smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest
      - run: uv run astro-fire smoke
      - name: Download script loads (no network)
        run: uv run python scripts/firms_download.py --help
      - name: Shell scripts parse
        run: for f in scripts/*.sh infra/gcp/*.sh infra/gcp/vm/*.sh deploy/cloudrun/*.sh; do bash -n "$f"; done

  app-backend:
    name: App backend (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - run: uv sync --frozen --group dev
      - run: uv run ruff check backend
      - run: uv run pytest

  app-frontend:
    name: App frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # same major version as app/Dockerfile
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
