[project]
name = "astro-fire"
version = "0.1.0"
description = "Harmonized MODIS + VIIRS active-fire hotspot pipeline (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[project.optional-dependencies]
# Read/write gs:// paths directly (on the VM or locally with gcloud ADC).
gcs = ["gcsfs>=2024.6"]
# Exploration in notebooks.
notebooks = ["jupyterlab>=4", "pandas>=2.2", "pyarrow>=16", "matplotlib>=3.8"]

[project.scripts]
astro-fire = "astro_fire.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_fire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
